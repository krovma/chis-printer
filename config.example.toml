# Kuper Printer microSD configuration (format version 1).
# The card root must also contain a .kproot file.
format_version = 1

[ui]
# Locale choices: en, zh, ja.
locale = "en"

[display]
# Palette choices: red, yellow, green, cyan, blue, magenta, white.
palette = "white"
# Integer 0..100; firmware settings panel adjusts in steps of 5 percent.
# Unreadable or invalid configuration uses white and 50 percent.
backlight_percent = 50

[m1]
# Seconds after the printer reports completion in which the next DATA group
# joins the same GBR file. Number 0..60; 0 disables joining. Default: 1 s.
auto_cut_time_limit = 1.0
# Seconds to report printer busy after PRINT. STATUS remains responsive.
# This delay is excluded from auto_cut_time_limit. Number 0..60; 0 disables it.
simulated_print_time = 1.0

[m2]
# SC rising edge to SI sampling delay, in microseconds (integer 2..10).
# Omit or use an invalid value to keep the measured default of 5 us.
rx_sample_delay_us = 5

[m3]
# First pairing discovers the printer by its Classic Bluetooth name.
printer_name = "PRINTER_NAME_HERE"
pin = "0000"
# Paper width: 37mm, 58mm, 80mm, or 110mm.
# Default image sizes are 160 (1x), 240 (1.5x), 320 (2x), 480 (3x),
# 640 (4x), and 800 (5x) dots per row.
printer_type = "58mm"
# Paper type: roll or label. Align the first label to the print head before printing.
paper_type = "roll"
# Length of the printable label in millimeters (integer 1..1000).
label_length_mm = 50
# Optional gap between labels (integer millimeters 0..100, default 0).
# TSPL supports gaps up to 25 mm on the documented Gprinter models.
# label_gap_mm = 2
# Protocol choices: escpos or tspl. Roll paper uses escpos.
protocol = "escpos"
# TSPL print direction: 1 (default) or 0.
# print_direction = 1
# Image centering: printer uses ESC a 1; firmware uses ESC a 0 and GS L
# to place the left white margin in dots within the selected printable width.
centering = "printer"

# Optional overrides for each printer type. Missing or invalid scale values
# use the selected type's default. 1x uses 4x4 Bayer dithering.
# Scale ranges: 37mm = 1x or 1.5x; 58mm = 1x, 1.5x, 2x; 80mm = 1..3x; 110mm = 1..5x.
# Missing left margins use (printable_width_dots - scaled_image_width) / 2.
# The on-device Right key restores this value for the selected paper width and scale.
# Saved left margins are raw GS L horizontal units; excessive values may clip the image.
# [m3.advance]
# 37mm paper: 35mm printable width at about 8 dots/mm, or 280 dots.
# printable_width_dots_37mm = 280
# image_scale_37mm = 1
# left_margin_dots_37mm_1x = 60
# left_margin_dots_37mm_1_5x = 20
# 58mm printer: print width 48mm at 203dpi; 2x gives 320 dots per line.
# printable_width_dots_58mm = 384
# image_scale_58mm = 2
# left_margin_dots_58mm_1x = 112
# left_margin_dots_58mm_1_5x = 72
# left_margin_dots_58mm_2x = 32
# 80mm printer: assumes 72mm printable width; 3x gives 480 dots per line.
# printable_width_dots_80mm = 576
# image_scale_80mm = 3
# left_margin_dots_80mm_1x = 208
# left_margin_dots_80mm_2x = 128
# left_margin_dots_80mm_3x = 48
# 110mm printer: 104mm printable width at 203dpi; 5x gives 800 dots.
# printable_width_dots_110mm = 831
# image_scale_110mm = 5
# left_margin_dots_110mm_1x = 335
# left_margin_dots_110mm_2x = 255
# left_margin_dots_110mm_3x = 175
# left_margin_dots_110mm_4x = 95
# left_margin_dots_110mm_5x = 15
